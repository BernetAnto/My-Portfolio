<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login Page</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .form-container {
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      width: 300px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    input {
      width: 92%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      margin: 12px 0;
    }
    .toggle-password {
      position: relative;
    }
    .toggle-password button {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      color: #007BFF;
    }
    .error {
      color: red;
      font-size: 12px;
    }
    button.submit {
      width: 100%;
      padding: 10px;
      background: #007BFF;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    button.submit:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <section class="form-container">
    <h2>Login</h2>
    <form id="loginForm">
      <input type="text" id="username" placeholder="Username" required>
      <span id="userError" class="error"></span>
      
      <section class="toggle-password">
        <input type="password" id="password" placeholder="Password" required>
        <button type="button" onclick="togglePassword()">Show</button>
      </section>
      <span id="passError" class="error"></span>
      
      <button type="submit" class="submit"><a href="/Projects/Projects.html" target="_blank">Login</a></button>
    </form>
  </section>

  <script>
    const form = document.getElementById("loginForm");
    const username = document.getElementById("username");
    const password = document.getElementById("password");

    const userError = document.getElementById("userError");
    const passError = document.getElementById("passError");

    form.addEventListener("submit", function(e) {
      e.preventDefault();
      let valid = true;

      // Username validation
      if (username.value !== "antoSteeve") {
        userError.textContent = "Invalid username.";
        valid = false;
      } else {
        userError.textContent = "";
      }

      // Password validation
      if (password.value !== "antoSteeve") {
        passError.textContent = "Password is required.";
        valid = false;
      } else {
        passError.textContent = "";
      }

      if (valid) {
        alert("Login successful!");
      }
    });

    function togglePassword() {
      if (password.type === "password") {
        password.type = "text";
        event.target.textContent = "Hide";
      } else {
        password.type = "password";
        event.target.textContent = "Show";
      }
    }



    // password is correct redirect the user to home.html
    form.addEventListener("submit", function(e) {
      e.preventDefault();
      if (username.value === "antoSteeve" && password.value === "antoSteeve") {
        window.location.href = "projects.html";
      }
    });
  </script>
</body>
</html>
