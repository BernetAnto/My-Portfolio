<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #display{
            width: 80%;
            height: 250px;
            border: 1px solid black;
        }
        .box{
            justify-items: center;
        }
        #value{
            width: auto;
            height: 30px;
        }
        section{
            text-align: center;
        }
        button{
            width: 80px;
            height: 35px;
            margin: 5px;
            background-color: lightgray;
            border: none;
            cursor: pointer;
            font-weight: bold;
            font-size: 15px;
            border-radius: 5px;
        }
        button:hover{
            background-color: rgba(9, 196, 56, 0.5);
            color: whitesmoke;
            border: solid 1px black;
        }
    </style>
</head>
<body>
    <div>
        <div class="box">
            <h1 id="display">

            </h1>
        </div>

        <section >
        <button class="clr" onclick="changeColor('red')">Red</button>
        <button class="clr" onclick="changeColor('green')">Green</button>
        <button class="clr" onclick="changeColor('blue')">Blue</button>
        <button class="clr" onclick="changeColor('orange')">Orange</button>
        <button class="clr" onclick="changeColor('white')">None</button>
        </section>

        <br>

        <section>
        <input type="text" id="value" placeholder="Type you want Color">
        <button onclick="getInput()">Get Input</button>
        </section>

    </div>
</body>
<script>
    function getInput(){                                                        // User type Input color change function
        var userInput = document.getElementById('value').value;
        document.getElementById('display').style.backgroundColor = userInput;
    }

    function changeColor(color){                                                 // Predefined Color change function
        document.getElementById('display').style.backgroundColor = color;
    }


</script>
</html>
